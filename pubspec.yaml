name: merchant_delivery
description: Flyer Eats Merchant App

publish_to: 'none'

version: 4.0.0+40000

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Network
  dio: ^5.4.0
  http: ^1.2.1

  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # UI
  flutter_staggered_animations: ^1.1.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1

  # Connectivity (fixed)
  connectivity_plus: ^5.0.2

  # Permissions
  permission_handler: ^11.3.0

  # Firebase (FIXED)
  firebase_core: ^2.25.4
  firebase_messaging: ^14.7.10

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Audio
  audioplayers: ^5.2.1

  # Utils
  url_launcher: ^6.2.5
  open_filex: ^4.4.0
  device_info_plus: ^10.1.0

  fluttertoast: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path_android: "assets/images/app_icon.png"
  image_path_ios: "assets/images/app_icon.png"
